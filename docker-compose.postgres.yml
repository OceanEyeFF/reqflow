services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reqflow_dev
      POSTGRES_USER: reqflow
      POSTGRES_PASSWORD: reqflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqflow -d reqflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - reqflow-postgres-data:/var/lib/postgresql/data

volumes:
  reqflow-postgres-data:
